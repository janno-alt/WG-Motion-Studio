name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Build sidecar binaries (ffmpeg, ffprobe, whisper)
        run: |
          set -euo pipefail
          BIN_DIR="src-tauri/binaries"
          mkdir -p "$BIN_DIR"
          # ffmpeg + ffprobe from Homebrew (already include VideoToolbox).
          brew install ffmpeg
          cp "$(which ffmpeg)" "$BIN_DIR/ffmpeg-aarch64-apple-darwin"
          cp "$(which ffprobe)" "$BIN_DIR/ffprobe-aarch64-apple-darwin"
          chmod +x "$BIN_DIR/ffmpeg-aarch64-apple-darwin" "$BIN_DIR/ffprobe-aarch64-apple-darwin"
          # whisper.cpp built from source via cmake. The CLI binary that used
          # to be named `main` is now `whisper-cli` and lives at
          # build/bin/whisper-cli (the legacy `main` is just a deprecation stub).
          git clone --depth=1 https://github.com/ggerganov/whisper.cpp /tmp/whisper.cpp
          cmake -B /tmp/whisper.cpp/build -S /tmp/whisper.cpp -DCMAKE_BUILD_TYPE=Release
          cmake --build /tmp/whisper.cpp/build --config Release -j --target whisper-cli
          cp /tmp/whisper.cpp/build/bin/whisper-cli "$BIN_DIR/whisper-aarch64-apple-darwin"
          chmod +x "$BIN_DIR/whisper-aarch64-apple-darwin"

      - name: Verify signing secrets reach the runner
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Print only lengths / first 8 chars of the key — never the value.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY is EMPTY"
          else
            echo "✅ TAURI_SIGNING_PRIVATE_KEY present, length=${#TAURI_SIGNING_PRIVATE_KEY}, prefix=$(printf %.8s "$TAURI_SIGNING_PRIVATE_KEY")"
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY_PASSWORD is EMPTY"
          else
            echo "✅ TAURI_SIGNING_PRIVATE_KEY_PASSWORD present, length=${#TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          fi
          # Try to decode as base64 (Tauri stores the key file as base64).
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > /tmp/key-decoded 2>/dev/null; then
              first_line=$(head -1 /tmp/key-decoded)
              echo "✅ Key decodes; first line: $first_line"
              rm -f /tmp/key-decoded
            else
              echo "⚠️ Key value is not valid base64 — Tauri will treat it as a path or fail to decode"
            fi
          fi

      - name: Build + sign + upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "WG Video Studio ${{ github.ref_name }}"
          releaseBody: |
            See CHANGELOG.md for details.

            Auto-update will pick this release up on next launch via
            `latest.json` published as a release asset.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: false
          args: --target aarch64-apple-darwin
