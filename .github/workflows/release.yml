name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm deps
        run: npm ci

      - name: Build sidecar binaries (ffmpeg, ffprobe, whisper)
        run: |
          set -euo pipefail
          BIN_DIR="src-tauri/binaries"
          mkdir -p "$BIN_DIR"

          # ffmpeg + ffprobe must be STATICALLY linked: the previous brew-
          # install + cp approach shipped Homebrew binaries that are
          # dynamically linked to /opt/homebrew/Cellar/ffmpeg/8.1_1/lib/*.dylib.
          # Those paths only exist on the build runner — on a fresh user
          # machine the loader can't find them and import fails with
          # "Library not loaded: ... libavdevice.62.dylib".
          # @ffmpeg-installer / @ffprobe-installer ship pre-built static
          # binaries via npm with platform-aware optional deps, including
          # darwin-arm64.
          npm install --no-save @ffmpeg-installer/ffmpeg @ffprobe-installer/ffprobe
          FFMPEG_PATH=$(node -e "console.log(require('@ffmpeg-installer/ffmpeg').path)")
          FFPROBE_PATH=$(node -e "console.log(require('@ffprobe-installer/ffprobe').path)")
          cp "$FFMPEG_PATH"  "$BIN_DIR/ffmpeg-aarch64-apple-darwin"
          cp "$FFPROBE_PATH" "$BIN_DIR/ffprobe-aarch64-apple-darwin"
          chmod +x "$BIN_DIR/ffmpeg-aarch64-apple-darwin" "$BIN_DIR/ffprobe-aarch64-apple-darwin"
          # Sanity-check: binaries should run without referencing /opt/homebrew/.
          "$BIN_DIR/ffmpeg-aarch64-apple-darwin"  -hide_banner -version | head -1
          "$BIN_DIR/ffprobe-aarch64-apple-darwin" -hide_banner -version | head -1
          ! otool -L "$BIN_DIR/ffmpeg-aarch64-apple-darwin"  | grep -q "/opt/homebrew" \
            || (echo "❌ ffmpeg still links to /opt/homebrew dylibs" && exit 1)
          ! otool -L "$BIN_DIR/ffprobe-aarch64-apple-darwin" | grep -q "/opt/homebrew" \
            || (echo "❌ ffprobe still links to /opt/homebrew dylibs" && exit 1)

          # whisper.cpp built from source. -DBUILD_SHARED_LIBS=OFF keeps
          # the whisper-cli binary self-contained so we don't recreate the
          # same dylib problem with libwhisper.dylib / libggml.dylib.
          git clone --depth=1 https://github.com/ggerganov/whisper.cpp /tmp/whisper.cpp
          cmake -B /tmp/whisper.cpp/build -S /tmp/whisper.cpp \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build /tmp/whisper.cpp/build --config Release -j --target whisper-cli
          cp /tmp/whisper.cpp/build/bin/whisper-cli "$BIN_DIR/whisper-aarch64-apple-darwin"
          chmod +x "$BIN_DIR/whisper-aarch64-apple-darwin"

      - name: Verify signing secrets reach the runner
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          # Print only lengths / first 8 chars of the key — never the value.
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY is EMPTY"
          else
            echo "✅ TAURI_SIGNING_PRIVATE_KEY present, length=${#TAURI_SIGNING_PRIVATE_KEY}, prefix=$(printf %.8s "$TAURI_SIGNING_PRIVATE_KEY")"
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "❌ TAURI_SIGNING_PRIVATE_KEY_PASSWORD is EMPTY"
          else
            echo "✅ TAURI_SIGNING_PRIVATE_KEY_PASSWORD present, length=${#TAURI_SIGNING_PRIVATE_KEY_PASSWORD}"
          fi
          # Try to decode as base64 (Tauri stores the key file as base64).
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            if printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" | base64 -d > /tmp/key-decoded 2>/dev/null; then
              first_line=$(head -1 /tmp/key-decoded)
              echo "✅ Key decodes; first line: $first_line"
              rm -f /tmp/key-decoded
            else
              echo "⚠️ Key value is not valid base64 — Tauri will treat it as a path or fail to decode"
            fi
          fi

      - name: Normalize signing key (strip trailing whitespace)
        env:
          RAW_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          # GitHub Secrets sometimes preserve a trailing newline from the
          # paste source; Tauri's signer then fails to base64-decode silently
          # and skips signing without any visible error. Strip all whitespace
          # so the inner value is exactly the base64 blob Tauri expects, then
          # re-export it via GITHUB_ENV (with mask) so subsequent steps see
          # the cleaned value.
          CLEAN=$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')
          echo "::add-mask::$CLEAN"
          echo "TAURI_SIGNING_PRIVATE_KEY=$CLEAN" >> "$GITHUB_ENV"
          echo "Normalized key length: ${#CLEAN} (was ${#RAW_KEY})"
          # Re-verify decode after stripping
          if printf '%s' "$CLEAN" | base64 -d > /tmp/key-clean 2>/dev/null; then
            echo "✅ Cleaned key decodes; first line: $(head -1 /tmp/key-clean)"
            rm -f /tmp/key-clean
          else
            echo "❌ Cleaned key still not valid base64 — secret content is wrong, regenerate + repaste"
          fi

      - name: Build + sign + upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # TAURI_SIGNING_PRIVATE_KEY is inherited from GITHUB_ENV (cleaned).
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "WG Video Studio ${{ github.ref_name }}"
          releaseBody: |
            See CHANGELOG.md for details.

            Auto-update will pick this release up on next launch via
            `latest.json` published as a release asset.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: false
          args: --target aarch64-apple-darwin
